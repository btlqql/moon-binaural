<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MoonBinaural compass audio</title>
<main>
  <h1>MoonBinaural compass audio</h1>
  <p>A fixed beacon plays ahead. Turn the listener to move the sound between the ears.</p>
  <button id="play">Start beacon</button>
  <label>Listener direction <input id="yaw" type="range" min="-180" max="180" value="0">°</label>
  <p id="status" role="status"></p>
</main>
<script type="module" src="host.mjs"></script>
